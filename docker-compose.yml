services:
  skillhub:
    container_name: qianzhu-skill-manager
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3009:3009"
    user: "${SKILLHUB_UID:-501}:${SKILLHUB_GID:-20}"
    environment:
      NODE_ENV: production
      PORT: "3009"
    volumes:
      - ./catalog:/app/catalog
      - ./skillhub.config.json:/app/skillhub.config.json
      - /Users/mac/.claude:/Users/mac/.claude
      - /Users/mac/.codex:/Users/mac/.codex
      - /Users/mac/.agents:/Users/mac/.agents
    restart: unless-stopped
